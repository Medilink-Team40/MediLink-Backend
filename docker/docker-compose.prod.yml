# ============================================
# DOCKER COMPOSE PARA PRODUCCIÓN (Testing)
# ============================================

services:
  # ==================
  # Servicio API
  # ==================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NODE_ENV: production
    image: medilink-api:latest
    container_name: medilink_api_prod

    # Reinicio automático
    restart: unless-stopped

    # Puerto expuesto
    ports:
      - "${PORT:-3000}:3000"

    # Cargar variables desde archivo .env
    env_file:
      - .env

    # Variables críticas definidas en el entorno
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}

    # Healthcheck para verificar estado del servicio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Recursos limitados (ajustar según el servidor)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Logging optimizado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - medilink_network

# ==================
# Redes
# ==================
networks:
  medilink_network:
    driver: bridge
