services:
  - type: web
    name: medilink-backend
    env: node
    plan: free
    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm run build
    startCommand: |
      node --max-old-space-size=400 dist/main.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
